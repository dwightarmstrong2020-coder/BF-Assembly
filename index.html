<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>BF Compiler Tool</title>
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <h1>BF Compiler</h1>
        <br><br><br><br><br>
        <label>bf Code:</label><br>
        <textarea placeholder="Your bf code here..." id="bf" rows="20" cols="20" maxlength="10000"></textarea>
        <br><br><br><br><br>
        <label>bfASM Code:</label><br>
        <textarea id="bfasm"  placeholder="Auto-Generated bfASM code here..." disabled rows="20" cols="20"></textarea>
        <br><br>
        <button type="button" id="convert">Convert</button>        <button type="reset" id="clear">Clear</button> <button id="copy" type="button">Copy</button> <button id="download" type="button">Download</button>
        <script src="./script.js"></script>
    </body>
</html>
